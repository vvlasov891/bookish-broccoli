<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Games</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #18181b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 28px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 380px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .btn {
            display: block;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            background-color: #27272a;
            border: 2px solid #3f3f46;
            border-radius: 10px;
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #3f3f46;
            border-color: #71717a;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>Выбор игры</h1>

    <div class="button-container">
        <a href="http://ddlc.browsergames.abrdns.com" class="btn">
            DDLC (has script errors)
        </a>

        <a href="http://hl1.browsergames.abrdns.com" class="btn">
            HL1 (luggy with strange sound defectes)
        </a>
    </div>

</body>
</html>
